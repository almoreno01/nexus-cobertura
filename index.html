<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#104963">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus Cobertura">
  <title>Nexus Cobertura</title>
  <link rel="manifest" href="./manifest.webmanifest?v=9">
  <link rel="icon" type="image/png" sizes="180x180" href="./assets/nexus-app-icon.png?v=9">
  <link rel="shortcut icon" type="image/png" href="./assets/nexus-app-icon.png?v=9">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/nexus-app-icon.png?v=9">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./assets/nexus-app-icon.png?v=9">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./patch.css">
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="./app.js"></script>
  <script src="./patch.js"></script>
  <script src="./auto-refresh-on-add.js"></script>
  <script src="./conteos-support.js"></script>
  <script>
    document.addEventListener('wheel', event => {
      const input = event.target.closest?.('#avgDays, #coverageDays');
      if (input && document.activeElement === input) input.blur();
    }, { capture: true, passive: true });
  </script>
</body>
</html>
